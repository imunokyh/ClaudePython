[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "child-lock"
version = "0.1.0"
description = "전자식 차일드락 제어 SW (PC/SIL 참조 구현)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.3",
]

[tool.setuptools.package-data]
child_lock = ["web/static/*"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
# Starlette TestClient의 httpx 폐기 예정 안내(외부 라이브러리 경고)만 무시한다.
# 대체 패키지는 검증 전이라 도입하지 않았다. 그 밖의 경고는 그대로 표시한다.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests", "tools"]
# Claude Code 스킬 스크립트와 문서에 보존한 시험 케이스 생성 스크립트
# (docs/swe6/*.py)는 제품 코드가 아니므로 검사하지 않는다
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: 명명 규칙(Google Python Style),
# C90: 순환 복잡도, B: bugbear, UP: 최신 문법, SIM: 단순화
# BLE/S102/S307/PLW0603/F403: Python 부분집합 (SWE2-SAP SA-11)
select = [
    "E", "W", "F", "I", "N", "C90", "B", "UP", "SIM",
    "BLE", "S102", "S307", "PLW0603", "F403",
]

[tool.ruff.lint.per-file-ignores]
# QM 호출 격리를 위한 포괄 예외 처리 (SWE2-ARC 2.4, SWE2-SAP 1.2)
"src/child_lock/controller.py" = ["BLE001"]
"src/child_lock/runtime/runner.py" = ["BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 10
